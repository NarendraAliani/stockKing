spring.application.name=StockKing
server.port=${SERVER_PORT:8080}

# Safe defaults: no broker credentials, no DB connection, and no live trading.
stockking.trading.mode=paper
stockking.trading.live-enabled=false
stockking.risk.per-trade-percent=1.0
stockking.risk.max-daily-loss-percent=2.0
stockking.risk.max-consecutive-losses=2
stockking.risk.max-entries-per-day=3
stockking.paper.starting-capital=${STOCKKING_PAPER_STARTING_CAPITAL:100000}
stockking.paper.trading-zone=${STOCKKING_PAPER_TRADING_ZONE:Asia/Kolkata}
# Local paper journal is opt-in; never points at the existing application database.
stockking.paper.persistence.enabled=${STOCKKING_PAPER_PERSISTENCE_ENABLED:false}
stockking.paper.persistence.path=${STOCKKING_PAPER_JOURNAL_PATH:./data/paper-journal.json}

spring.thymeleaf.cache=false
management.endpoints.enabled-by-default=false
