spring.application.name=StockKing
server.port=${SERVER_PORT:8080}

# Safe defaults: no broker credentials, no DB connection, and no live trading.
stockking.trading.mode=paper
stockking.trading.live-enabled=false
stockking.risk.per-trade-percent=1.0
stockking.risk.max-daily-loss-percent=2.0
stockking.risk.max-consecutive-losses=2
stockking.risk.max-entries-per-day=3

spring.thymeleaf.cache=false
management.endpoints.enabled-by-default=false
